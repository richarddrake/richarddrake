name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall app

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Build backend image
        run: docker compose -f docker-compose.yml build backend

      - name: Build frontend image
        run: docker compose -f docker-compose.yml build frontend

      - name: Prepare image names
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          repo="${repo,,}"
          short_sha="${GITHUB_SHA::7}"
          echo "BACKEND_IMAGE=ghcr.io/${owner}/${repo}-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${owner}/${repo}-frontend" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${short_sha}" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build release images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker build -f Dockerfile.backend \
            -t "$BACKEND_IMAGE:latest" \
            -t "$BACKEND_IMAGE:sha-$SHORT_SHA" \
            .
          docker build -f frontend/Dockerfile \
            -t "$FRONTEND_IMAGE:latest" \
            -t "$FRONTEND_IMAGE:sha-$SHORT_SHA" \
            ./frontend

      - name: Push release images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$BACKEND_IMAGE:latest"
          docker push "$BACKEND_IMAGE:sha-$SHORT_SHA"
          docker push "$FRONTEND_IMAGE:latest"
          docker push "$FRONTEND_IMAGE:sha-$SHORT_SHA"
