name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall app

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    outputs:
      backend_image: ${{ steps.image_meta.outputs.backend_image }}
      frontend_image: ${{ steps.image_meta.outputs.frontend_image }}
      short_sha: ${{ steps.image_meta.outputs.short_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate production Docker Compose
        env:
          BACKEND_IMAGE: ghcr.io/example/ai-test-backend
          FRONTEND_IMAGE: ghcr.io/example/ai-test-frontend
          IMAGE_TAG: latest
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Build backend image
        run: docker compose -f docker-compose.yml build backend

      - name: Build frontend image
        run: docker compose -f docker-compose.yml build frontend

      - name: Prepare image names
        id: image_meta
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          repo="${repo,,}"
          short_sha="${GITHUB_SHA::7}"
          echo "BACKEND_IMAGE=ghcr.io/${owner}/${repo}-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${owner}/${repo}-frontend" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${short_sha}" >> "$GITHUB_ENV"
          echo "backend_image=ghcr.io/${owner}/${repo}-backend" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/${owner}/${repo}-frontend" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build release images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker build -f Dockerfile.backend \
            -t "$BACKEND_IMAGE:latest" \
            -t "$BACKEND_IMAGE:sha-$SHORT_SHA" \
            .
          docker build -f frontend/Dockerfile \
            -t "$FRONTEND_IMAGE:latest" \
            -t "$FRONTEND_IMAGE:sha-$SHORT_SHA" \
            ./frontend

      - name: Push release images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$BACKEND_IMAGE:latest"
          docker push "$BACKEND_IMAGE:sha-$SHORT_SHA"
          docker push "$FRONTEND_IMAGE:latest"
          docker push "$FRONTEND_IMAGE:sha-$SHORT_SHA"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check deployment configuration
        id: deploy_config
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::notice::Deployment secrets are not configured; image publishing completed and server deployment was skipped."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        if: steps.deploy_config.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          port="${DEPLOY_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$port" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload deployment files
        if: steps.deploy_config.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
        run: |
          port="${DEPLOY_PORT:-22}"
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          remote_path="${DEPLOY_PATH:-ai-testcase-platform}"

          ssh -i ~/.ssh/deploy_key -p "$port" "$remote" "mkdir -p '$remote_path'"
          ssh -i ~/.ssh/deploy_key -p "$port" "$remote" "mkdir -p '$remote_path/docker'"
          scp -i ~/.ssh/deploy_key -P "$port" docker-compose.prod.yml scripts/deploy-prod.sh "$remote:$remote_path/"
          scp -i ~/.ssh/deploy_key -P "$port" -r docker/mysql "$remote:$remote_path/docker/"
          ssh -i ~/.ssh/deploy_key -p "$port" "$remote" "chmod +x '$remote_path/deploy-prod.sh'"

          if [ -n "$DEPLOY_ENV_FILE" ]; then
            printf '%s\n' "$DEPLOY_ENV_FILE" > deploy.env
            scp -i ~/.ssh/deploy_key -P "$port" deploy.env "$remote:$remote_path/.env"
          fi

      - name: Deploy on server
        if: steps.deploy_config.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          BACKEND_IMAGE: ${{ needs.docker.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.docker.outputs.frontend_image }}
          IMAGE_TAG: sha-${{ needs.docker.outputs.short_sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          port="${DEPLOY_PORT:-22}"
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          remote_path="${DEPLOY_PATH:-ai-testcase-platform}"

          ssh -i ~/.ssh/deploy_key -p "$port" "$remote" \
            "BACKEND_IMAGE='$BACKEND_IMAGE' FRONTEND_IMAGE='$FRONTEND_IMAGE' IMAGE_TAG='$IMAGE_TAG' GHCR_USERNAME='$GHCR_USERNAME' GHCR_TOKEN='$GHCR_TOKEN' DEPLOY_PATH='$remote_path' '$remote_path/deploy-prod.sh'"
