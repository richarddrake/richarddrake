services:
  mysql:
    image: mysql:8.0
    container_name: ai-test-mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ai_test_root
      MYSQL_DATABASE: ai_testcase
      MYSQL_USER: ai_test_user
      MYSQL_PASSWORD: ai_test_password
    ports:
      - "3306:3306"
    volumes:
      - ai-test-mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uai_test_user", "-pai_test_password"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ai-test-backend
    environment:
      DATABASE_ENABLED: "true"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ai_test_user
      MYSQL_PASSWORD: ai_test_password
      MYSQL_DATABASE: ai_testcase
      MYSQL_CHARSET: utf8mb4
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8000
    container_name: ai-test-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  ai-test-mysql-data:
